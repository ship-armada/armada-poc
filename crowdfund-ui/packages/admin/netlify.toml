# Netlify build config — crowdfund admin app deploy.
#
# This file is picked up because the Netlify site is configured with
# Package directory = "crowdfund-ui/packages/admin" in the UI, and the toml's
# own `base` declaration below matches. The committer app's root-level
# netlify.toml is a separate Netlify site and isn't affected.
#
# Env vars set in the Netlify UI (not committed):
#   DEPLOYMENT_INSTANCE            optional override; defaults to "medi3".
#                                  The build script re-exports it as
#                                  VITE_DEPLOYMENT_INSTANCE so the bundled
#                                  admin reads the matching instance file
#                                  at runtime — set this one var only
#                                  (build-step variable, no VITE_ prefix
#                                  because it's never read by bundled JS).
#   VITE_CROWDFUND_PROFILE         "medi" or "mainnet" (default mainnet).
#                                  Selects the constants the bundle bakes in.
#   VITE_CROWDFUND_INDEXER_URL     optional indexer API base URL — when set,
#                                  the admin's event log is seeded from the
#                                  indexer snapshot before falling back to RPC.
#   VITE_SEPOLIA_RPC               optional — paid RPC dodges public rate limits.
#   VITE_SEPOLIA_RPC_FALLBACK      optional secondary RPC.
#   VITE_SENTRY_DSN                optional runtime Sentry. NOTE: source maps are
#                                  NOT uploaded by this build; events show
#                                  minified stack traces.
#   VITE_SENTRY_ENVIRONMENT        optional ("production", "staging", etc.)
#   VITE_SENTRY_RELEASE            optional — e.g. crowdfund-admin-${INSTANCE}@${COMMIT_REF}
#   VITE_SENTRY_TRACES_SAMPLE_RATE optional [0..1].

[build]
  base    = "crowdfund-ui/packages/admin"
  publish = "dist"
  # Build flow:
  #   1. cd to workspace root (npm needs the root package.json + lockfile)
  #   2. clean any cached node_modules from a previous deploy attempt
  #   3. install with --legacy-peer-deps (Railgun SDK peer-dep conflict)
  #   4. cd back to base, fetch the selected deployment instance's manifest
  #      from the armada-deployments repo into public/api/deployments/
  #   5. cd to workspace root and build the admin workspace
  command = """
    cd ../../.. && \
    rm -rf node_modules package-lock.json && \
    npm install --legacy-peer-deps && \
    cd crowdfund-ui/packages/admin && \
    INSTANCE="${DEPLOYMENT_INSTANCE:-medi3}" && \
    export VITE_DEPLOYMENT_INSTANCE="${INSTANCE}" && \
    BASE="https://raw.githubusercontent.com/ship-armada/armada-deployments/main/testnet/${INSTANCE}" && \
    echo "Fetching crowdfund deployment manifest for instance: ${INSTANCE}" && \
    mkdir -p "public/api/deployments/instances/${INSTANCE}/sepolia" && \
    curl -sfL -o "public/api/deployments/instances/${INSTANCE}/sepolia/crowdfund.json" "${BASE}/sepolia/crowdfund.json" && \
    cd ../../.. && \
    npm run build --workspace=@armada/crowdfund-admin
  """

[build.environment]
  # Required: Railgun SDK peer-dep conflict forces legacy resolution.
  NPM_FLAGS    = "--legacy-peer-deps"
  NODE_VERSION = "20"
  # Lifted heap limit — committer's build OOM'd at the 2 GB default with tsc -b
  # + vite build + workspace graph in scope; admin shares the same workspace.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Switches network-dependent decisions in the app (manifest path, hub RPC,
  # chain ID 11155111, sepolia.etherscan, 15s poll). Other VITE_* env vars
  # are set via the Netlify UI as deploy-context env vars (see header).
  VITE_NETWORK = "sepolia"

# SPA fallback — admin uses client-side routing for some flows.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
