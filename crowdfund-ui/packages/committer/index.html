<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set data-theme before first paint to avoid a flash. Light mode is
      // opt-in: default to dark and honor only an explicit saved light choice
      // (we intentionally do not follow the OS prefers-color-scheme).
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('armada-theme');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <title>Armada Crowdfund</title>
    <meta name="description" content="Join the Armada crowdfund — commit USDC, invite others, and claim ARM." />
    <meta name="theme-color" content="#1a1b1f" />

    <!-- Open Graph — invite links are shared in chats, so previews matter.
         og:image intentionally omitted: no designer social-card asset exists yet. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Armada Crowdfund" />
    <meta property="og:description" content="Join the Armada crowdfund — commit USDC, invite others, and claim ARM." />
    <meta property="og:url" content="https://fund.armada.blue/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Armada Crowdfund" />
    <meta name="twitter:description" content="Join the Armada crowdfund — commit USDC, invite others, and claim ARM." />
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
