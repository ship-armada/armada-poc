# ABOUTME: Docker Compose stack for the crowdfund indexer API, the Discord alert
# ABOUTME: evaluator loop, and the Postgres store.
name: crowdfund-indexer

services:
  indexer:
    image: ${INDEXER_IMAGE:?set INDEXER_IMAGE to a locally built tag, e.g. crowdfund-indexer:<git-sha>}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind to loopback only; the host nginx terminates TLS and proxies in.
      - "127.0.0.1:${CROWDFUND_INDEXER_PORT:-3002}:${CROWDFUND_INDEXER_PORT:-3002}"
    volumes:
      - indexer-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CROWDFUND_INDEXER_PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  alerts:
    image: ${INDEXER_IMAGE:?set INDEXER_IMAGE to a locally built tag, e.g. crowdfund-indexer:<git-sha>}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Shares the data volume with the indexer: reads the file store, owns alerts.json.
      - indexer-data:/app/data
    # One-shot evaluator on a fixed interval. $$ defers expansion to the
    # container shell so CROWDFUND_ALERT_INTERVAL_SECONDS comes from .env. A failed run
    # is logged and retried next tick; each successful run refreshes a heartbeat file
    # that the healthcheck below reads, so a persistently failing evaluator shows as
    # unhealthy instead of silently "Up".
    command:
      - sh
      - -c
      - 'mkdir -p data/crowdfund-indexer; while true; do if node_modules/.bin/tsx packages/indexer/src/cli/index.ts evaluate-alerts; then touch data/crowdfund-indexer/alerts.heartbeat; else echo "evaluate-alerts FAILED (exit $$?)" >&2; fi; sleep $${CROWDFUND_ALERT_INTERVAL_SECONDS:-60}; done'
    healthcheck:
      # Healthy while the last successful run is newer than 3 intervals.
      test: ["CMD", "node", "-e", "const fs=require('fs');const max=3*Number(process.env.CROWDFUND_ALERT_INTERVAL_SECONDS||60)*1000;try{process.exit(Date.now()-fs.statSync('data/crowdfund-indexer/alerts.heartbeat').mtimeMs<max?0:1)}catch{process.exit(1)}"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 180s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowdfund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crowdfund}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crowdfund}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  indexer-data:
  postgres-data:
